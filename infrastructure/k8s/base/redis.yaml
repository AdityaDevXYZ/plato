
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plato-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plato-redis
  template:
    metadata:
      labels:
        app: plato-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: plato-redis-svc
spec:
  ports:
  - port: 6379
  selector:
    app: plato-redis
