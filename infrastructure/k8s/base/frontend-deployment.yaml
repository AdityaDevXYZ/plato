
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plato-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: plato-frontend
  template:
    metadata:
      labels:
        app: plato-frontend
    spec:
      containers:
        - name: web
          image: plato-registry/plato-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.plato.aero/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.plato.aero/ws"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: plato-frontend-svc
spec:
  selector:
    app: plato-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: plato-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: plato-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
